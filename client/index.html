<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101713" />
    <meta
      name="description"
      content="Бункер — социальная карточная игра: случайные персонажи, скрытые характеристики и голосования за места в убежище."
    />
    <title>БУНКЕР · Право на будущее</title>
    <style>
      html {
        background: #171a16;
        color: #edece3;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
      }
      #boot-screen {
        min-height: 100svh;
        display: grid;
        place-content: center;
        gap: 16px;
        box-sizing: border-box;
        padding: 32px;
        text-align: center;
      }
      #boot-screen h1 {
        margin: 0;
        color: #ddbf8c;
        font-size: 32px;
        letter-spacing: 0.12em;
      }
      #boot-screen p {
        max-width: 420px;
        margin: 0 auto;
        line-height: 1.6;
        color: #b9bdb4;
      }
      #boot-screen a {
        color: #ddbf8c;
        padding: 12px;
      }
      #boot-screen [hidden] {
        display: none;
      }
    </style>
    <script>
      (function () {
        var bootFailed = false;
        function status(message, retry) {
          var label = document.getElementById('boot-message');
          if (!label) {
            if (document.readyState === 'loading')
              document.addEventListener(
                'DOMContentLoaded',
                function () {
                  status(message, retry);
                },
                { once: true },
              );
            return;
          }
          label.textContent = message;
          if (retry) document.getElementById('boot-retry').hidden = false;
        }
        function failed() {
          bootFailed = true;
          status(
            'Не удалось загрузить игру. Обновите страницу или откройте актуальную ссылку от ведущего.',
            true,
          );
        }
        window.addEventListener(
          'error',
          function (event) {
            if (event.message || (event.target && event.target.tagName === 'SCRIPT')) failed();
          },
          true,
        );
        window.addEventListener('unhandledrejection', failed);
        setTimeout(function () {
          if (!bootFailed)
            status(
              'Файлы игры ещё загружаются. На медленном подключении потребуется больше времени.',
              false,
            );
        }, 20000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main id="boot-screen" aria-live="polite">
        <h1>БУНКЕР</h1>
        <p id="boot-message" role="status">Загружаем игру…</p>
        <a id="boot-retry" href="" hidden>Обновить страницу</a>
        <noscript>Для игры нужен JavaScript. Включите его в настройках браузера.</noscript>
      </main>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
