name: BUNKER checks
on:
  push:
  pull_request:
jobs:
  game:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bunker
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bunker
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U bunker" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://bunker:ci-only-password@localhost:5432/bunker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:deploy
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
