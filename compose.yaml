services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bunker
      POSTGRES_DB: bunker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or .env}
    volumes:
      - bunker-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bunker -d bunker']
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    image: bunker-last-shelter:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bunker:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/bunker?schema=public
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      PORT: 3001
      HOST: 0.0.0.0
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:3001'
    stop_grace_period: 15s
volumes:
  bunker-db:
